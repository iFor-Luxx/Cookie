<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13151b" />
    <title>Cookie — dibujo compartido</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Tema adaptativo al sistema (clase .dark antes del primer paint, sin flash) -->
    <script>
      try {
        var root = document.documentElement;
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          root.classList.toggle("dark", mq.matches);
          root.style.colorScheme = mq.matches ? "dark" : "light";
        };
        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
        else if (mq.addListener) mq.addListener(apply);
      } catch (e) {}
    </script>
    <!-- Fuentes bundle local (public/fonts, offline-safe en APK) -->
    <link
      rel="preload"
      href="/fonts/InstrumentSerif.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistPixel.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
