apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// H-updates: versionado y firma piloto desde local.properties (gitignored).
// Sin estas claves se usan versionCode 1 / firma debug (solo desarrollo).
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) {
    localFile.withInputStream { localProps.load(it) }
}
def pilotKeystore = localProps.getProperty('cookie.keystore.file')
def appVersionCode = (localProps.getProperty('cookie.versionCode') ?: '1').toInteger()
def appVersionName = localProps.getProperty('cookie.versionName') ?: '1.0'

android {
    namespace = "dev.luxury.cookie"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.luxury.cookie"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        pilot {
            if (pilotKeystore) {
                storeFile file(pilotKeystore)
                storePassword localProps.getProperty('cookie.keystore.storePassword')
                keyAlias localProps.getProperty('cookie.keystore.keyAlias')
                keyPassword localProps.getProperty('cookie.keystore.keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (pilotKeystore) {
                signingConfig signingConfigs.pilot
            }
        }
        debug {
            // Piloto por USB/sideload: misma firma que release si hay keystore.
            if (pilotKeystore) {
                signingConfig signingConfigs.pilot
            }
        }
    }
    kotlinOptions {
        // Alineado con sourceCompatibility 21 de capacitor.build.gradle.
        jvmTarget = '21'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // H6: background sync (WorkManager) + push (FCM). Sin google-services.json
    // el plugin de abajo no se aplica y FCM queda inactivo, pero compila.
    implementation "androidx.work:work-runtime-ktx:$workmanagerVersion"
    implementation platform("com.google.firebase:firebase-bom:$firebaseBomVersion")
    implementation "com.google.firebase:firebase-messaging"
    // H-updates: solo RTDB para el aviso de versión (lectura puntual al
    // abrir; sin google-services.json el chequeo se omite, pero compila).
    implementation "com.google.firebase:firebase-database"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
